name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint skills
        run: python3 scripts/lint_skills.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate template registry
        run: python3 skills/gdd-owner/scripts/validate_registry.py templates/design
      - name: Shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/init-project.sh
